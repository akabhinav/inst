version: '3.8'

services:
  # PostgreSQL - User Service Database
  postgres-users:
    image: postgres:16-alpine
    container_name: instagram-postgres-users
    environment:
      POSTGRES_DB: instagram_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
    networks:
      - instagram-network

  # PostgreSQL - Post Service Database
  postgres-posts:
    image: postgres:16-alpine
    container_name: instagram-postgres-posts
    environment:
      POSTGRES_DB: instagram_posts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-posts-data:/var/lib/postgresql/data
    networks:
      - instagram-network

  # Redis - Caching & Sessions
  redis:
    image: redis:7-alpine
    container_name: instagram-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - instagram-network

  # Apache Kafka - Message Queue
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: instagram-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - instagram-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: instagram-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - instagram-network

  # MinIO - Object Storage (S3 Compatible)
  minio:
    image: minio/minio:latest
    container_name: instagram-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - instagram-network

  # Elasticsearch - Search Engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: instagram-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - instagram-network

  # Cassandra - Feed/Timeline Storage (Optional for Phase 3)
  # cassandra:
  #   image: cassandra:4.1
  #   container_name: instagram-cassandra
  #   ports:
  #     - "9042:9042"
  #   environment:
  #     CASSANDRA_CLUSTER_NAME: instagram-cluster
  #   volumes:
  #     - cassandra-data:/var/lib/cassandra
  #   networks:
  #     - instagram-network

volumes:
  postgres-users-data:
  postgres-posts-data:
  redis-data:
  minio-data:
  elasticsearch-data:
  # cassandra-data:

networks:
  instagram-network:
    driver: bridge
